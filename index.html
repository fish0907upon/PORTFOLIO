<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PORTFOLIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFFFFF;
    --ink: #111111;
    --ink-soft: #8A8A8A;
    --muted: #BBBBBB;
    --line: rgba(0, 0, 0, .14);
    --font: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --bounce: cubic-bezier(.34, 1.56, .64, 1);
    --doc-h: clamp(180px, 33vh, 320px);
    --pad-x: clamp(40px, 6.5vw, 110px);
    --pad-y: clamp(36px, 8vh, 84px);
    --aside-w: clamp(190px, 17vw, 240px);
    --sec-w: clamp(140px, 11.2vw, 168px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--font);
    font-size: 12px; font-weight: 400; -webkit-font-smoothing: antialiased; overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; }
  img { -webkit-user-drag: none; user-select: none; }
  :focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }

  /* ---------- 封面 ---------- */
  #cover {
    position: fixed; inset: 0; z-index: 40; background: var(--paper);
    display: grid; place-items: center;
    transition: transform .9s cubic-bezier(.7, 0, .2, 1), opacity .9s;
  }
  #cover.gone { transform: translateY(-100%); opacity: .4; pointer-events: none; }
  /* 坐标系取自原手写稿 (1100 × 470 区域)，各图层按百分比定位 */
  .hand { position: relative; width: min(36vw, 540px); aspect-ratio: 1100 / 470; }
  .hand img { display: block; }
  /* 书写层：手写稿按笔画路径逐笔露出，坐标为 title.png 的像素 (880 × 190) */
  .hand .ink { position: absolute; left: 2.727%; top: 8.94%; width: 80%; height: 40.43%; overflow: visible; }
  .hand .ink image { mix-blend-mode: multiply; }
  .hand h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .hand .word {
    position: absolute; padding: 0; opacity: 0; transform: translateY(16px);
    transition: opacity .5s, transform .7s var(--bounce);
  }
  .hand .word img { width: 100%; transition: transform .45s var(--bounce); }
  .hand .word::after {
    content: attr(data-zh); position: absolute; left: 50%; top: 105%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: .4em; color: var(--ink-soft); white-space: nowrap; opacity: 0; transition: opacity .3s;
  }
  .hand .word:hover img, .hand .word:focus-visible img { transform: translateY(-5px) rotate(-2deg); }
  .hand .word:hover::after, .hand .word:focus-visible::after { opacity: 1; }
  .hand.done .word { opacity: 1; transform: none; }
  .hand.done .word:nth-of-type(2) { transition-delay: .18s; }
  .hand.done .word:nth-of-type(3) { transition-delay: .36s; }
  .hand.done .word:nth-of-type(4) { transition-delay: .54s; }
  .w-about { left: -13.45%; top: 75.5%; width: 27.82%; }
  .w-design { left: 23.82%; top: 75.53%; width: 23.09%; }
  .w-fonts { left: 56.36%; top: 74.04%; width: 19.27%; }
  .w-product { left: 85.55%; top: 73.4%; width: 24.82%; }
  .cover-foot {
    position: absolute; left: 0; right: 0; bottom: 32px; display: flex; justify-content: center; gap: 28px;
    font-size: 11px; letter-spacing: .3em; color: var(--muted);
  }
  .cover-foot button { color: var(--muted); letter-spacing: .3em; }
  .cover-foot button:hover { color: var(--ink); }
  #skipHint { transition: opacity .4s; }
  .hand.done ~ .cover-foot #skipHint { opacity: 0; }

  /* ---------- 主体：左检索列 + 右内容 ---------- */
  #app {
    display: grid; grid-template-columns: var(--aside-w) 1fr; height: 100vh;
    padding: var(--pad-y) 0 var(--pad-y) var(--pad-x); position: relative;
  }
  aside { display: flex; flex-direction: column; min-height: 0; padding-right: 20px; }
  .sec-img { display: block; width: calc(var(--unit) * var(--r, 1)); height: auto; mix-blend-mode: multiply; }
  .sec-current { --unit: var(--sec-w); align-self: flex-start; margin-bottom: 18px; }
  .sec-current button { padding: 0; }
  /* About Me 的小人：放在右上角，人物右边缘与右侧文字对齐；鼠标移入时只出现周围的「Hi~」和星星 */
  .hello {
    --hello-w: calc(var(--sec-w) * .84);
    position: absolute; top: 9px; right: calc(var(--pad-x) - var(--hello-w) * .173); width: var(--hello-w); cursor: default;
  }
  .about.show .hello { animation: rise .55s var(--bounce) both; animation-delay: .35s; }
  .hello img { display: block; width: 100%; height: auto; mix-blend-mode: multiply; }
  .hello .hi {
    position: absolute; inset: 0; opacity: 0; transform: scale(.9);
    transition: opacity .2s, transform .5s var(--bounce);
  }
  .hello:hover .hi, .hello:focus-visible .hi { opacity: 1; transform: none; }
  .menu { flex: 1; overflow-y: auto; list-style: none; padding-right: 6px; }
  .menu > li { margin-bottom: 12px; }
  /* 未选中的分组：灰色、与子标题同字号；当前分组：黑色、稍大 */
  .g-btn {
    display: flex; gap: 10px; width: 100%; text-align: left; font-size: 10.5px; font-weight: 400;
    letter-spacing: .1em; padding: 3px 0; color: var(--ink-soft); transition: color .25s, font-size .25s;
  }
  .g-btn:hover { color: var(--ink); }
  .g-btn.current { font-size: 11px; font-weight: 500; letter-spacing: .14em; color: var(--ink); }
  .g-btn .no { color: var(--muted); font-weight: 400; letter-spacing: .06em; }
  .g-btn.active { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }
  .items { list-style: none; margin: 4px 0 0; }
  .i-btn {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 4px 0;
    font-size: 10.5px; letter-spacing: .1em; line-height: 1.6; color: var(--ink-soft); transition: color .2s;
  }
  .i-btn::before {
    content: ""; flex: 0 0 4px; height: 4px; border-radius: 50%; border: 1px solid currentColor;
    transition: background .2s, transform .35s var(--bounce);
  }
  .i-btn:hover { color: var(--ink); }
  .i-btn.active { color: var(--ink); }
  .i-btn.active::before { background: currentColor; transform: scale(1.3); }
  .i-btn.empty { color: var(--muted); }
  .sec-others { --unit: calc(var(--sec-w) * .88); display: flex; flex-direction: column; gap: 22px; align-items: flex-start; padding-top: 24px; }
  .sec-others button { padding: 0; opacity: .4; transition: opacity .25s, transform .35s var(--bounce); }
  .sec-others button:hover { opacity: 1; transform: translateX(4px) rotate(-2deg); }
  .menu-anim > li { animation: rise .55s var(--bounce) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  main { position: relative; min-width: 0; display: flex; flex-direction: column; }
  /* 右上「内容」栏 */
  .info {
    position: relative; align-self: flex-end; margin-right: var(--pad-x); max-width: 55%; padding-top: 10px;
    font-size: 10px; letter-spacing: .14em;
  }
  .info .path { display: block; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info .path b { color: var(--ink); font-weight: 500; }
  /* 备注：绝对定位，有无备注都不影响图片位置 */
  .info .note { position: absolute; top: 100%; right: 0; margin-top: 8px; color: var(--ink-soft); white-space: nowrap; }

  /* 文件横排：统一高度，左滑浏览；从画面约 44% 处开始 */
  /* 个人介绍：整体居右，右边缘与右上角、右下角的文字对齐 */
  .about {
    flex: 1; min-height: 0; display: none; flex-direction: column; justify-content: center; align-items: flex-end;
    position: relative; padding: clamp(80px, 17vh, 150px) var(--pad-x) 6px 0;
  }
  .about.show { display: flex; }
  .about-list {
    display: grid; grid-template-columns: max-content max-content 1fr; gap: 14px 0; align-items: baseline;
    width: max-content; min-width: clamp(260px, 27vw, 380px);
    font-size: 11px; letter-spacing: .12em; line-height: 1.6;
  }
  .about-list dt { grid-column: 1; padding-right: 20px; color: var(--ink-soft); }
  .about-list dd { grid-column: 2; color: var(--ink); }
  .about-list a { text-decoration: none; border-bottom: 1px solid var(--line); padding-bottom: 2px; transition: border-color .2s; }
  .about-list a:hover { border-color: var(--ink); }
  .about-list .span { grid-column: 1 / -1; }
  .about-list .rule-wrap { grid-column: 1 / 3; }
  .about-list .lead { color: var(--ink-soft); letter-spacing: .14em; }
  .rule { display: block; height: 1px; background: #B5B5B5; margin: 14px 0; }
  .about.show .about-list > * { animation: rise .55s var(--bounce) both; animation-delay: calc(var(--n, 0) * 45ms); }
  .about.show .rule-wrap { animation: ruleIn .8s cubic-bezier(.3, .7, .3, 1) both; animation-delay: .2s; }
  @keyframes ruleIn { from { clip-path: inset(-50% 100% -50% 0); } to { clip-path: inset(-50% -2% -50% 0); } }

  .strip-wrap.hide { display: none; }
  .strip-wrap {
    flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; position: relative;
    margin-left: max(0px, calc(44vw - var(--pad-x) - var(--aside-w)));
  }
  .strip {
    display: flex; align-items: flex-start; gap: clamp(16px, 1.8vw, 28px); overflow-x: auto; overflow-y: hidden;
    padding: 10px var(--pad-x) 6px clamp(24px, 4vw, 64px); scrollbar-width: none; cursor: grab; scroll-behavior: auto;
  }
  .strip::-webkit-scrollbar { display: none; }
  .strip.dragging { cursor: grabbing; }
  .strip.dragging .doc { pointer-events: none; }
  .doc { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  .doc .frame { height: var(--doc-h); display: flex; transition: transform .45s var(--bounce); }
  .doc img { height: 100%; width: auto; display: block; box-shadow: 0 0 0 1px rgba(0,0,0,.06); background: #fff; }
  .doc.clear img { box-shadow: none; background: transparent; }
  .doc:hover .frame { transform: translateY(-4px); }
  .doc figcaption { font-size: 9.5px; color: var(--ink-soft); letter-spacing: .14em; max-width: 220px; }
  .doc.is-empty .frame {
    aspect-ratio: 4 / 5; border: 1px dashed var(--muted); display: grid; place-items: center;
    color: var(--muted); font-size: 10px; letter-spacing: .3em;
  }
  .strip-anim .doc { animation: docIn .7s var(--bounce) both; }
  @keyframes docIn { from { opacity: 0; transform: translateX(80px); } to { opacity: 1; transform: none; } }
  .edge-l { animation: edgeL .5s var(--bounce); }
  .edge-r { animation: edgeR .5s var(--bounce); }
  @keyframes edgeL { 40% { transform: translateX(30px); } }
  @keyframes edgeR { 40% { transform: translateX(-30px); } }

  .strip-ctrl {
    display: flex; align-items: center; gap: 10px; padding: 26px var(--pad-x) 0 clamp(24px, 4vw, 64px);
    color: var(--ink-soft); font-size: 9.5px;
  }
  .strip-ctrl .bar { flex: 1; height: 1px; background: var(--line); position: relative; max-width: 160px; margin-left: 6px; }
  .strip-ctrl .bar i { position: absolute; left: 0; top: -.5px; height: 2px; background: var(--ink); transition: width .25s; }
  .strip-ctrl .hint { margin-left: auto; letter-spacing: .24em; color: var(--muted); }

  .page-mark {
    position: absolute; right: var(--pad-x); bottom: calc(var(--pad-y) * .55);
    font-size: 9px; letter-spacing: .3em; color: var(--muted);
  }

  /* 大图查看 */
  #viewer {
    position: fixed; inset: 0; z-index: 30; background: rgba(255,255,255,.97);
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  }
  #viewer.open { display: flex; animation: fade .3s both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  #viewer .v-stage { width: 84vw; height: 80vh; display: grid; place-items: center; touch-action: pan-y; }
  #viewer img { max-width: 100%; max-height: 100%; display: block; }
  #viewer .v-cap { font-size: 11px; color: var(--ink-soft); letter-spacing: .08em; }
  #viewer .v-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 50%; font-size: 16px; background: #fff; }
  #viewer .v-prev { left: 3vw; } #viewer .v-next { right: 3vw; }
  #viewer .v-close { position: absolute; top: 24px; right: 32px; font-size: 11px; letter-spacing: .3em; color: var(--ink-soft); }
  #viewer .v-close:hover { color: var(--ink); }
  .anim-next { animation: inNext .6s var(--bounce) both; }
  .anim-prev { animation: inPrev .6s var(--bounce) both; }
  @keyframes inNext { from { opacity: 0; transform: translateX(12%) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes inPrev { from { opacity: 0; transform: translateX(-12%) scale(.97); } to { opacity: 1; transform: none; } }

  /* 减少动态效果 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    #cover.gone { transform: none; opacity: 0; }
  }

  @media (max-width: 860px) {
    body { overflow: auto; }
    #app { grid-template-columns: 1fr; height: auto; min-height: 100vh; padding: 28px 0 28px 24px; gap: 24px; }
    .sec-others { flex-direction: row; padding-top: 12px; }
    .info { align-self: stretch; margin-right: 24px; min-width: 0; max-width: none; }
    .strip { padding-right: 24px; }
    .hand { width: 76vw; }
    .about { padding-top: 10px; }
    .hello { position: static; align-self: flex-start; margin-bottom: 8px; }
    .hello .hi { width: 100%; }
    .page-mark, .strip-ctrl .hint { display: none; }
    :root { --doc-h: 46vh; }
  }
</style>
</head>

const secImg = key => trimmed[key] || $(`.w-${key} img`).getAttribute("src");
function trimInk(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const ctx = c.getContext("2d");
      ctx.drawImage(img, 0, 0);
      const { data, width, height } = ctx.getImageData(0, 0, c.width, c.height);
      let x0 = width, y0 = height, x1 = -1, y1 = -1;
      for (let y = 0; y < height; y++) for (let x = 0; x < width; x++) {
        const k = (y * width + x) * 4;
        if (data[k + 3] > 40 && data[k] + data[k + 1] + data[k + 2] < 480) {
          if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
      }
      if (x1 < 0) return resolve({ src, w: 0 });
      const out = document.createElement("canvas");
      out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
      out.getContext("2d").drawImage(c, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
      resolve({ src: out.toDataURL("image/png"), w: out.width });
    };
    img.onerror = () => resolve({ src, w: 0 });
    img.src = src;
  });
}
const state = { sec: "design", g: 0, i: 0 };

const menu = $("#menu"), strip = $("#strip");

function titleBtn(key) {
  return `<button data-sec="${key}" aria-label="${SECTIONS[key].name} ${SECTIONS[key].zh}"><img class="sec-img" data-key="${key}" src="${secImg(key)}" style="--r:${(inkW[key] / inkW.design).toFixed(3)}" alt=""></button>`;
}

function renderAside(animate) {
  const s = SECTIONS[state.sec];
  $("#secCurrent").innerHTML = titleBtn(state.sec);
  $("#secOthers").innerHTML = ORDER.filter(k => k !== state.sec).map(titleBtn).join("");
  menu.innerHTML = s.groups.map((g, gi) => `
    <li style="animation-delay:${gi * 70}ms">
      <button class="g-btn" data-g="${gi}"><span class="no">${g.no}</span><span>${g.title}</span></button>
      ${g.items ? `<ul class="items">${g.items.map((it, ii) =>
        `<li><button class="i-btn ${it.images && it.images.length ? "" : "empty"}" data-g="${gi}" data-i="${ii}">${it.title}</button></li>`).join("")}</ul>` : ""}
    </li>`).join("");
  menu.classList.toggle("menu-anim", !!animate);
  markMenu();
}
function markMenu() {
  menu.querySelectorAll(".g-btn").forEach(b => {
    b.classList.toggle("current", +b.dataset.g === state.g);
    b.classList.toggle("active", +b.dataset.g === state.g && state.i === null);
  });
  menu.querySelectorAll(".i-btn").forEach(b => b.classList.toggle("active", +b.dataset.g === state.g && +b.dataset.i === state.i));
}

/* 当前展示的文件列表 */
function currentDocs() {
  const s = SECTIONS[state.sec], g = s.groups[state.g];
  if (g.items && state.i === null) {
    // 分组总览：每件作品的第一张（封面）作为一个文件
    return { path: [s.name, `${g.no} ${g.title}`], docs: g.items.map((it, ii) => ({ src: it.images && it.images[0], cap: it.title, open: ii, clear: it.clear })) };
  }
  const it = g.items ? g.items[state.i] : g;
  return {
    path: g.items ? [s.name, `${g.no} ${g.title}`, it.title] : [s.name, `${g.no} ${g.title}`],
    docs: (it.images || []).map((src, k) => ({ src, cap: pad(k + 1), view: k, clear: it.clear })),
    item: it,
  };
}

let shown = null;
function renderStrip() {
  const isAbout = state.sec === "about";
  $("#stripWrap").classList.toggle("hide", isAbout);
  $("#about").classList.toggle("show", isAbout);
  if (isAbout) {
    shown = null;
    $("#infoPath").innerHTML = "<b>About Me</b>";
    $("#infoNote").textContent = "";
    return;
  }
  shown = currentDocs();
  const { path, docs } = shown;
  $("#infoNote").textContent = (shown.item && shown.item.note) || "";
  $("#infoPath").innerHTML = path.map((p, k) => k === path.length - 1 ? `<b>${p}</b>` : p).join("　/　");
  strip.innerHTML = docs.length ? docs.map((d, k) => `
    <figure class="doc ${d.clear ? "clear" : ""} ${d.src ? "" : "is-empty"}" data-k="${k}" style="animation-delay:${Math.min(k, 6) * 70}ms">
      <div class="frame">${d.src ? `<img src="${d.src}" alt="${d.cap}" loading="${k < 6 ? "eager" : "lazy"}" draggable="false">` : "整理中"}</div>
      <figcaption>${d.cap}</figcaption>
    </figure>`).join("")
    : `<figure class="doc is-empty"><div class="frame">整理中</div><figcaption>作品整理中</figcaption></figure>`;
  strip.scrollLeft = 0;
  strip.classList.remove("strip-anim"); void strip.offsetWidth; strip.classList.add("strip-anim");
  updateBar();
}

function go(g, i) {
  state.g = g; state.i = i;
  markMenu(); renderStrip();
}

menu.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.classList.contains("i-btn")) go(+b.dataset.g, +b.dataset.i);
  else go(+b.dataset.g, SECTIONS[state.sec].groups[+b.dataset.g].items ? null : 0);
});

/* ---------- 板块切换：手写标题 FLIP 动画 ---------- */
function switchSection(key) {
  if (key === state.sec) return;
  const before = {};
  document.querySelectorAll("aside .sec-img").forEach(img => before[img.dataset.key] = img.getBoundingClientRect());
  state.sec = key; state.g = 0; state.i = 0;
  renderAside(true);
  renderStrip();
  if (reduceMotion.matches) return;
  document.querySelectorAll("aside .sec-img").forEach(img => {
    const a = before[img.dataset.key], b = img.getBoundingClientRect();
    if (!a) return;
    img.animate([
      { transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${a.height / b.height})`, transformOrigin: "0 0" },
      { transform: "none", transformOrigin: "0 0" },
    ], { duration: 750, easing: "cubic-bezier(.34,1.4,.64,1)" });
  });
}
$("#secCurrent").addEventListener("click", () => openCover());
$("#secOthers").addEventListener("click", e => { const b = e.target.closest("button"); if (b) switchSection(b.dataset.sec); });

/* ---------- 横排拖动 / 左滑 ---------- */
let dragX = null, dragStart = 0, moved = 0;
strip.addEventListener("pointerdown", e => {
  if (e.pointerType !== "mouse") return;   // 触控用原生滑动
  dragX = e.clientX; dragStart = strip.scrollLeft; moved = 0;
});
window.addEventListener("pointermove", e => {
  if (dragX === null) return;
  moved = e.clientX - dragX;
  if (Math.abs(moved) > 4) strip.classList.add("dragging");
  strip.scrollLeft = dragStart - moved;
});
window.addEventListener("pointerup", () => {
  if (dragX === null) return;
  const wasDrag = Math.abs(moved) > 4;
  dragX = null;
  setTimeout(() => strip.classList.remove("dragging"), 0);
  if (wasDrag && atEdge(moved < 0 ? 1 : -1)) bounce(moved < 0 ? 1 : -1);
});
strip.addEventListener("wheel", e => {
  if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { strip.scrollLeft += e.deltaY; e.preventDefault(); }
}, { passive: false });
strip.addEventListener("scroll", updateBar, { passive: true });

function atEdge(dir) {
  return dir > 0 ? strip.scrollLeft + strip.clientWidth >= strip.scrollWidth - 2 : strip.scrollLeft <= 0;
}
function bounce(dir) {
  if (reduceMotion.matches) return;
  strip.classList.remove("edge-l", "edge-r"); void strip.offsetWidth;
  strip.classList.add(dir > 0 ? "edge-r" : "edge-l");
}
function step(dir) {
  if (atEdge(dir)) return bounce(dir);
  const docs = [...strip.children], x = strip.scrollLeft;
  const target = dir > 0 ? docs.find(d => d.offsetLeft > x + 10) : [...docs].reverse().find(d => d.offsetLeft < x - 10);
  strip.scrollTo({ left: target ? target.offsetLeft - 8 : (dir > 0 ? strip.scrollWidth : 0), behavior: reduceMotion.matches ? "auto" : "smooth" });
}
function updateBar() {
  const max = strip.scrollWidth - strip.clientWidth;
  const vis = strip.scrollWidth ? strip.clientWidth / strip.scrollWidth : 1;
  $("#bar").style.width = `${Math.max(vis, max > 0 ? strip.scrollLeft / max : 1) * 100}%`;
}

strip.addEventListener("click", e => {
  if (strip.classList.contains("dragging")) return;
  const f = e.target.closest(".doc"); if (!f || !shown || f.classList.contains("is-empty")) return;
  const d = shown.docs[+f.dataset.k];
  if (d.open !== undefined) go(state.g, d.open);
  else openViewer(d.view);
});

/* ---------- 大图查看 ---------- */
const viewer = $("#viewer");
let vIndex = 0;
function openViewer(k) { viewer.classList.add("open"); showView(k, 0); $("#vClose").focus(); }
function closeViewer() { viewer.classList.remove("open"); }
function showView(k, dir) {
  const docs = shown.docs;
  if (k < 0 || k >= docs.length) return;
  vIndex = k;
  const img = new Image(); img.src = docs[k].src; img.alt = docs[k].cap;
  if (dir && !reduceMotion.matches) img.className = dir > 0 ? "anim-next" : "anim-prev";
  $("#vStage").replaceChildren(img);
  $("#vCap").textContent = `${pad(k + 1)} / ${pad(docs.length)}`;
  $("#vPrev").disabled = k === 0; $("#vNext").disabled = k === docs.length - 1;
}
$("#vClose").onclick = closeViewer;
$("#vPrev").onclick = () => showView(vIndex - 1, -1);
$("#vNext").onclick = () => showView(vIndex + 1, 1);
viewer.addEventListener("click", e => { if (e.target === viewer) closeViewer(); });
let vx = null;
$("#vStage").addEventListener("pointerdown", e => vx = e.clientX);
$("#vStage").addEventListener("pointerup", e => {
  if (vx === null) return;
  const dx = e.clientX - vx; vx = null;
  if (dx < -50) showView(vIndex + 1, 1); else if (dx > 50) showView(vIndex - 1, -1);
});

document.addEventListener("keydown", e => {
  if (!$("#cover").classList.contains("gone")) { if (e.key === "Enter") enter("design"); return; }
  if (viewer.classList.contains("open")) {
    if (e.key === "Escape") closeViewer();
    if (e.key === "ArrowRight") showView(vIndex + 1, 1);
    if (e.key === "ArrowLeft") showView(vIndex - 1, -1);
    return;
  }
  if (state.sec === "about") return;
  if (e.key === "ArrowRight") step(1);
  if (e.key === "ArrowLeft") step(-1);
});

/* ---------- 封面 ---------- */
// Portfolio 每一笔的中心线（按书写顺序），坐标对应 title.png
const STROKE_PATHS = [
  "M28 30 L32 166", "M32 42 C60 38 95 40 104 62 C112 85 100 110 75 114 L35 116",                         // P
  "M200 90 C185 80 155 80 145 98 C134 120 140 152 165 160 C190 166 210 150 211 125 C212 105 208 96 196 88", // o
  "M263 52 L268 138", "M266 88 C276 70 292 62 305 66 C315 69 320 74 325 75",                              // r
  "M370 18 L370 130", "M338 42 C365 44 395 48 425 54",                                                      // t
  "M520 38 C505 28 487 30 482 50 C478 80 482 130 482 165 C480 172 474 173 468 170", "M432 95 L527 97",    // f
  "M625 72 C612 58 585 58 575 78 C566 98 572 125 595 130 C618 133 633 118 632 98 C631 86 628 78 620 70",  // o
  "M676 34 L687 126",                                                                                       // l
  "M738 78 L737 123", "M733 40 L741 44",                                                                    // i
  "M855 52 C835 42 808 42 802 60 C796 85 800 115 820 120 C845 124 862 112 866 95 C868 75 862 58 845 48",  // o
];
const LETTER_ENDS = new Set([1, 2, 4, 6, 8, 9, 10, 12]); // 写完这些笔画后多停一下
const SPEED = 1.15;       // 每毫秒写多少像素
const LIFT_MS = 80;       // 笔画之间提笔移动
const LETTER_PAUSE = 45;
const PENCIL_TIP = [12, 200];   // 铅笔图中笔尖的位置
const PENCIL_REST = [883, -27]; // 手写稿里铅笔原本的位置
const hand = $("#hand"), strokesEl = $("#strokes"), pencilEl = $("#pencil");
strokesEl.innerHTML = STROKE_PATHS.map(d => `<path d="${d}"/>`).join("");
const paths = [...strokesEl.children].map(p => { const len = p.getTotalLength(); p.style.strokeDasharray = len; return { p, len }; });
let rafId = 0;

function placePencil(x, y, angle = 0) {
  pencilEl.setAttribute("transform", `translate(${x - PENCIL_TIP[0]} ${y - PENCIL_TIP[1]}) rotate(${angle} ${PENCIL_TIP[0]} ${PENCIL_TIP[1]})`);
}
const ease = t => t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2;

// 把整段书写拆成「写一笔 / 提笔移动 / 停顿」的时间线
function buildTimeline() {
  const steps = [];
  let pos = { x: PENCIL_REST[0] + PENCIL_TIP[0] - 40, y: 175 };
  paths.forEach(({ p, len }, i) => {
    const start = p.getPointAtLength(0), end = p.getPointAtLength(len);
    steps.push({ type: "move", from: pos, to: start, ms: i === 0 ? 400 : LIFT_MS });
    steps.push({ type: "draw", i, ms: len / SPEED });
    if (LETTER_ENDS.has(i)) steps.push({ type: "move", from: end, to: end, ms: LETTER_PAUSE });
    pos = end;
  });
  steps.push({ type: "move", from: pos, to: { x: PENCIL_REST[0] + PENCIL_TIP[0], y: PENCIL_REST[1] + PENCIL_TIP[1] }, ms: 350, rest: true });
  return steps;
}

function showFinal() {
  cancelAnimationFrame(rafId);
  paths.forEach(({ p }) => p.style.strokeDashoffset = 0);
  placePencil(PENCIL_REST[0] + PENCIL_TIP[0], PENCIL_REST[1] + PENCIL_TIP[1]);
  hand.classList.add("done");
}
const finishWriting = showFinal;

function writeCover() {
  cancelAnimationFrame(rafId);
  hand.classList.remove("done");
  if (reduceMotion.matches) return showFinal();
  paths.forEach(({ p, len }) => p.style.strokeDashoffset = len);
  const steps = buildTimeline();
  let k = 0, t0 = performance.now();
  const frame = now => {
    let step = steps[k], t = (now - t0) / step.ms;
    while (t >= 1) {
      if (step.type === "draw") paths[step.i].p.style.strokeDashoffset = 0;
      if (++k >= steps.length) { showFinal(); return; }
      t0 += step.ms; step = steps[k]; t = (now - t0) / step.ms;
    }
    const wobble = Math.sin(now / 55) * 2.5;
    if (step.type === "draw") {
      const { p, len } = paths[step.i], l = len * ease(t);
      p.style.strokeDashoffset = len - l;
      const pt = p.getPointAtLength(l);
      placePencil(pt.x, pt.y, wobble);
    } else {
      // 提笔：沿直线移动并稍微抬高
      const e = ease(t), lift = step.rest ? 0 : Math.sin(Math.PI * t) * 14;
      placePencil(step.from.x + (step.to.x - step.from.x) * e, step.from.y + (step.to.y - step.from.y) * e - lift, step.rest ? 0 : wobble * .4);
    }
    rafId = requestAnimationFrame(frame);
  };
  placePencil(steps[0].from.x, steps[0].from.y);
  rafId = requestAnimationFrame(frame);
}
function enter(key) {
  $("#cover").classList.add("gone");
  if (key !== state.sec) { state.sec = key; state.g = 0; state.i = 0; renderAside(true); renderStrip(); }
  else { renderStrip(); }
}
function openCover() { closeViewer(); $("#cover").classList.remove("gone"); writeCover(); }

$("#cover").addEventListener("click", e => {
  const w = e.target.closest(".word");
  if (e.target.closest("#replayBtn")) return openCover();
  if (!hand.classList.contains("done")) return finishWriting();
  if (w) enter(w.dataset.sec);
});

function hiOnly() {
  const [plain, hi] = document.querySelectorAll(".hello img");
  const load = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
  Promise.all([load(plain.src), load(hi.src)]).then(([a, b]) => {
    const c = document.createElement("canvas");
    c.width = b.naturalWidth; c.height = b.naturalHeight;
    const ctx = c.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(a, 0, 0); const pa = ctx.getImageData(0, 0, c.width, c.height);
    ctx.drawImage(b, 0, 0); const pb = ctx.getImageData(0, 0, c.width, c.height);
    for (let k = 0; k < pb.data.length; k += 4) {
      const diff = pa.data[k] - pb.data[k];
      pb.data[k] = pb.data[k + 1] = pb.data[k + 2] = 17;
      pb.data[k + 3] = diff > 40 ? Math.min(255, diff * 1.15) : 0;
    }
    ctx.putImageData(pb, 0, 0);
    hi.src = c.toDataURL("image/png");
  }).catch(() => {});
}

renderAside(false);
hiOnly();
Promise.all(ORDER.map(k => trimInk(secImg(k)).then(({ src, w }) => {
  trimmed[k] = src;
  if (w) inkW[k] = w;
}))).then(() => renderAside(false));
renderStrip();
writeCover();
</script>
</body>
</html>
